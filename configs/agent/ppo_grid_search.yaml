# @package _global_
# PPO 网格搜索专用配置
# 自动适应不同的 num_envs 和 rollout_length 组合

workflow_cls: evorl.algorithms.ppo.PPOWorkflow

# 网格搜索参数（会被命令行覆盖）
num_envs: 64
rollout_length: 1024

# 固定训练配置
normalize_obs: true
normalize_gae: true
total_timesteps: 20971520  # 1024 * 1024 * 20
discount: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
gae_horizon: 0

minibatch_size: 256
reuse_rollout_epochs: 4

# 评估配置（轻量化以减少开销）
num_eval_envs: 8
eval_episodes: 8
# 动态计算：每消耗 10% 的 total_timesteps 评估一次（总共评估10次）
eval_interval: ${eval_interval_10pct:${total_timesteps},${num_envs},${rollout_length}}



# 损失权重
loss_weights:
  actor_loss: 1.0
  critic_loss: 0.5
  actor_entropy: -0.01

# 优化器配置
optimizer:
  lr: 0.0003
  grad_clip_norm: 5.0

# 网络结构
agent_network:
  actor_hidden_layer_sizes: [256, 256]
  critic_hidden_layer_sizes: [256, 256]
  policy_obs_key: null
  value_obs_key: null

